name: Verify and import upstream baseline

on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-bootstrap
  cancel-in-progress: false

jobs:
  baseline:
    if: github.repository == 'salmanbashir80/8002keys'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      UPSTREAM_SHA: e13bf0165dbfec4ff3f7d559f5f57899e6549575
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - name: Check out exact upstream source and history
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/SysAdminDoc/SwiftFloris.git
          git fetch upstream master
          git cat-file -e "$UPSTREAM_SHA^{commit}"
          git worktree add --detach "$RUNNER_TEMP/8002keys-upstream" "$UPSTREAM_SHA"
      - name: Build and test unchanged upstream
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/8002keys-upstream"
          bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/upstream-baseline.log"
      - name: Preserve history and import verified upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Do not import again or overwrite an existing Android project.
          if test -e app/build.gradle.kts; then
            echo "Android project already exists; refusing a second import."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp README.md "$RUNNER_TEMP/initial-readme.md"
          if ! git merge --allow-unrelated-histories --no-commit "$UPSTREAM_SHA"; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "README.md" || { echo "Unexpected conflicts; import stopped."; exit 1; }
          fi
          git show "$UPSTREAM_SHA:README.md" > docs/UPSTREAM_README.md
          cp "$RUNNER_TEMP/initial-readme.md" docs/INITIAL_REPOSITORY_README.md
          cat > README.md <<'EOF'
          # 8002Keys
          
          Private Android keyboard project owned by Salman Bashir.
          
          Foundation: [SwiftFloris](https://github.com/SysAdminDoc/SwiftFloris),
          derived from FlorisBoard. Apache-2.0; original LICENSE, NOTICE, LICENSES
          and copyright headers are preserved.
          
          The pinned upstream baseline has been imported with Git history after
          Android assemble, unit-test and lint gates. This is still the upstream
          application identity. Rebranding to 8002Keys / com.salmanbashir.keys8002
          is the next step. No 8002Keys APK or production release is claimed yet.
          
          Historical upstream claims are preserved in docs/UPSTREAM_README.md;
          they are not a feature-verification report for this fork.
          EOF
          chmod +x gradlew
          git add -f README.md docs/UPSTREAM_README.md docs/INITIAL_REPOSITORY_README.md
          git add gradlew
          git commit -m "chore: import verified SwiftFloris baseline with upstream history"
          # The connector-created initial README and bootstrap commits remain ancestors.
          # Both pushes are fast-forward only; concurrent user changes stop this operation.
          gh auth setup-git
          git push --atomic origin HEAD:main HEAD:develop
          {
            echo "## Verified upstream import"
            echo "Upstream: $UPSTREAM_SHA"
            echo "Imported commit: $(git rev-parse HEAD)"
            echo "Android assemble, unit tests and lint completed before import."
            echo "No 8002Keys prerelease published by this bootstrap."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-baseline-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/upstream-baseline.log
            ${{ runner.temp }}/8002keys-upstream/app/build/reports/tests/
            ${{ runner.temp }}/8002keys-upstream/app/build/test-results/
            ${{ runner.temp }}/8002keys-upstream/app/build/reports/lint-results-debug.*
